<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movimientos bancarios de Mary</title>
<meta name="robots" content="noindex">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#f0efea; --line:#e2e0d9;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7873;
  --in:#2a78d6; --out:#eb6834; --accent:#1c5cab;
  --warn-bg:#fff4dc; --warn-tx:#7a4d00; --ok-bg:#e3f4ea; --ok-tx:#0f5a32; --err-bg:#fde7e6; --err-tx:#8a1f1d;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33322f;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8d86;
    --in:#3987e5; --out:#d95926; --accent:#86b6ef;
    --warn-bg:#3a2c0b; --warn-tx:#f3cf85; --ok-bg:#12321f; --ok-tx:#9ee0b8; --err-bg:#3d1716; --err-tx:#f3a9a7;
  }
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:200px}
header h1 small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root:where(:not([data-theme="light"])) .btn.pri{color:#0b0b0b}
@media (prefers-color-scheme:light){.btn.pri{color:#fff}}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--err-tx)}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
nav{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line)}
nav button{appearance:none;border:0;background:none;font:inherit;font-size:14px;padding:9px 12px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px}
.bar label{font-size:13px;color:var(--text-2)}
select,input[type=search],input[type=text]{font:inherit;font-size:14px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
main{padding:0 18px 40px;max-width:1200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 4px}
.card .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12.5px;color:var(--text-2)}
.kpi .v{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--text-2);font-size:12.5px;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.deb{color:var(--text)}
.cr{color:var(--ok-tx);font-weight:550}
.small{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--text-2);margin-right:4px;white-space:nowrap}
.tag.auto{background:var(--warn-bg);color:var(--warn-tx)}
.msg{border-radius:10px;padding:11px 14px;margin:12px 18px 0;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok-tx)}
.msg.warn{background:var(--warn-bg);color:var(--warn-tx)}
.msg.err{background:var(--err-bg);color:var(--err-tx)}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg .x{float:right;cursor:pointer;border:0;background:none;color:inherit;font-size:16px}
.empty{text-align:center;padding:50px 20px}
.empty h2{font-size:18px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--text-2);margin-top:14px}
#overlay{position:fixed;inset:0;background:rgba(28,92,171,.15);border:4px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;z-index:50;color:var(--text)}
#overlay.on{display:flex}
#tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.15);border-radius:8px;padding:8px 10px;font-size:13px;display:none;z-index:60;min-width:150px}
#tip b{display:block;margin-bottom:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--text-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{display:flex;gap:16px;font-size:13px;color:var(--text-2);margin-bottom:6px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hbar .track{height:14px}
.hbar .fill{height:14px;border-radius:0 4px 4px 0;background:var(--out)}
.hbar .val{font-variant-numeric:tabular-nums;color:var(--text)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:420px;width:100%;border:1px solid var(--line)}
.modal h3{margin:0 0 8px;font-size:16px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dupg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.dupg .h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.status{font-size:12px;color:var(--muted)}
svg text{fill:var(--text-2);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Movimientos bancarios de Mary<small id="cuentaInfo">Cargá el resumen que descargás del banco</small></h1>
  <span class="badge" id="stBadge">Conectando…</span>
  <button class="btn" id="btnRef" title="Volver a leer los datos de la hoja">↻ Actualizar</button>
  <button class="btn" id="btnSalir" title="Cambiar de clave">Salir</button>
  <label class="btn pri" for="file" id="btnFile" hidden>＋ Añadir resumen del banco</label>
  <input type="file" id="file" accept=".xlsx,.xls,.csv" multiple hidden>
</header>
<nav id="tabs"></nav>
<div id="msgs"></div>
<div class="bar" id="filtros"></div>
<main id="view"></main>
<div id="overlay">Soltá aquí el Excel del banco</div>
<div id="tip"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtARS = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:2});
const money = v => fmtARS.format(v||0);
const money0 = v => new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(v||0);
const compact = v => { const a=Math.abs(v); if(a>=1e6) return "$"+(v/1e6).toFixed(1).replace(".",",")+" M"; if(a>=1e3) return "$"+Math.round(v/1e3)+" mil"; return "$"+Math.round(v); };
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mesLabel = ym => { const [y,m]=ym.split("-"); return MESES[+m-1].replace(/^./,c=>c.toUpperCase())+" "+y; };
const mesCorto = ym => { const [y,m]=ym.split("-"); return MESES[+m-1].slice(0,3)+" "+y.slice(2); };
const fFecha = iso => { const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; };
const addDays = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+Math.round(n)); return d.toISOString().slice(0,10); };
const diffDays = (a,b) => Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const median = arr => { if(!arr.length) return 0; const s=[...arr].sort((a,b)=>a-b), k=s.length>>1; return s.length%2?s[k]:(s[k-1]+s[k])/2; };
const titleCase = s => s.toLowerCase().replace(/(^|[\s\/])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());

/* ---------- estado ---------- */
const CATS_DEF = ["Cuidadoras","Familia","Servicios","Seguros","Compras","Ingresos ANSES","Alquileres","Préstamos","Intereses","Otros","Sin clasificar"];
let S = { rows:[], config:{alias:{},cat:{},okDup:{},cuenta:""}, imports:[] };
let UI = { tab:"resumen", periodo:"todo", q:"", tipoF:"todos", cpF:"", trF:"todas" };

/* ---------- datos: Google Sheets a través del Apps Script ---------- */
/* Dirección de la implementación del Apps Script (termina en /exec). */
const API_URL = "https://script.google.com/macros/s/AKfycbw_P-pzltSzq8Mz6LgVa7iDe1uYPc9465Lltwy4MV_x4BB6j1blqKYc37H_oALdYs5d/exec";
const LS_KEY = "bancoMamClave";
let ROL = null;            // "admin" | "lectura"
const esAdmin = () => ROL === "admin";
function getClave(){ try{ return localStorage.getItem(LS_KEY)||""; }catch(e){ return ""; } }
function setClave(k){ try{ k?localStorage.setItem(LS_KEY,k):localStorage.removeItem(LS_KEY); }catch(e){} }
async function apiGet(k){
  const r = await fetch(API_URL+"?k="+encodeURIComponent(k)+"&t="+Date.now(), {redirect:"follow"});
  if(!r.ok) throw new Error("el servidor respondió "+r.status);
  return r.json();
}
async function apiPost(accion, datos){
  const r = await fetch(API_URL, {method:"POST", redirect:"follow", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({k:getClave(), accion}, datos||{}))});
  if(!r.ok) throw new Error("el servidor respondió "+r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error==="solo_lectura" ? "esta clave solo permite ver" : j.error==="clave" ? "clave incorrecta" : j.error);
  return j;
}
let wq = Promise.resolve();
function persist(fn){ wq = wq.then(fn).catch(e=>{ console.error(e); showMsg("err","No se pudo guardar en la hoja: "+esc(e.message||e)+". Tocá «Actualizar» y volvé a intentarlo."); }); return wq; }
function aplicarDatos(d){
  S.rows = d.rows||[];
  S.imports = d.imports||[];
  S.config = {alias:{}, cat:{}, okDup:d.okDup||{}, cuenta:d.cuenta||""};
  for(const [k,v] of Object.entries(d.contrapartes||{})){ if(v.nombre) S.config.alias[k]=v.nombre; if(v.cat) S.config.cat[k]=v.cat; }
  rebuild();
}
async function recargar(silencioso){
  const badge=$("#stBadge");
  badge.textContent="Cargando…";
  try{
    const d = await apiGet(getClave());
    if(!d.ok){ setClave(""); ROL=null; pantallaClave(d.error==="clave"?"Clave incorrecta.":"No se pudo entrar."); return; }
    ROL = d.rol; aplicarDatos(d);
    badge.textContent = esAdmin() ? "Administrador" : "Solo lectura";
    badge.title = esAdmin() ? "Podés cargar resúmenes y cambiar nombres y categorías." : "Podés ver todo, pero no cambiar nada.";
    $("#btnFile").hidden = !esAdmin();
    render();
  }catch(e){
    console.error(e); badge.textContent="Sin conexión";
    document.querySelectorAll("#msgs .msg.err").forEach(m=>m.remove());
    showMsg("err","No pude conectar con la hoja de Google ("+esc(e.message)+"). Si tenés internet, el problema está en el Apps Script: abrí su enlace /exec para ver el error, y recordá implementar siempre una «Nueva versión» después de cambiar el código.");
    render();
  }
}
const stripRow = r => ({id:r.id,f:r.f,d:r.d,deb:r.deb,cred:r.cred,saldo:r.saldo,imp:r.imp,ord:r.ord});

/* ---------- lectura del Excel del banco ---------- */
function parseMonto(v){
  if(v===null||v===undefined||v==="") return 0;
  if(typeof v==="number") return Math.round(v*100)/100;
  let s = String(v).replace(/[^\d,.\-]/g,"");
  if(!s) return 0;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1) s = s.replace(/\./g,"");
  const n = parseFloat(s); return isNaN(n)?0:Math.round(n*100)/100;
}
function parseFecha(v){
  const p2 = n => String(n).padStart(2,"0");
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+"-"+p2(v.getMonth()+1)+"-"+p2(v.getDate());
  if(typeof v==="number" && v>20000 && v<80000){ const o=XLSX.SSF.parse_date_code(v); return o.y+"-"+p2(o.m)+"-"+p2(o.d); }
  const m = String(v||"").match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return y+"-"+p2(m[2])+"-"+p2(m[1]); }
  return null;
}
const keyOf = r => [r.f, r.d.replace(/\s+/g," ").trim().toUpperCase(), r.deb.toFixed(2), r.cred.toFixed(2), r.saldo.toFixed(2)].join("|");

function parseFile(buf, name){
  const wb = XLSX.read(buf,{type:"array",cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const A = XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  let cuenta="", saldosAl="", h=-1;
  for(let i=0;i<A.length;i++){
    const c0 = norm(A[i][0]);
    if(c0.startsWith("cuenta")) cuenta = String(A[i][1]||"").trim();
    if(c0.startsWith("saldos al")) saldosAl = String(A[i][1]||"").trim();
    if(c0==="fecha" && A[i].some(c=>norm(c).startsWith("descrip"))){ h=i; break; }
  }
  if(h<0) throw new Error("no encuentro la fila de títulos (Fecha, Descripción, Débito, Crédito, Saldo). ¿Es el Excel de movimientos del banco?");
  const H = A[h].map(norm), col = p => H.findIndex(x=>x.startsWith(p));
  const iF=col("fecha"), iD=col("descrip"), iDb=col("debito"), iCr=col("credito"), iS=col("saldo");
  if([iF,iD,iDb,iCr].some(i=>i<0)) throw new Error("faltan columnas: necesito Fecha, Descripción, Débito y Crédito.");
  const rows=[];
  for(let i=h+1;i<A.length;i++){
    const R=A[i], f=parseFecha(R[iF]); if(!f) continue;
    const d=String(R[iD]||"").trim(); const deb=parseMonto(R[iDb]), cred=parseMonto(R[iCr]);
    if(!d && !deb && !cred) continue;
    rows.push({f,d,deb,cred,saldo:iS>=0?parseMonto(R[iS]):0,ord:rows.length});
  }
  if(!rows.length) throw new Error("el archivo no tiene movimientos.");
  return {name,cuenta,saldosAl,rows};
}

/* ---------- análisis de cada línea ---------- */
function analiza(desc){
  const d = String(desc||"");
  let m;
  if((m = d.match(/^TRANSFERENCIA\s+(D\/C|ENTRE CUENTAS)\s+VAR\s+(\d{8,11})\s*(.*)$/i))){
    const parts = m[3].trim().split(/\s{2,}/);
    return {tipo:"Transferencia", sub: /D\/C/i.test(m[1])?"a otro banco":"entre cuentas", id:m[2], nombre:(parts[0]||"").trim(), nota:parts.slice(1).join(" ").trim()};
  }
  if((m = d.match(/^COMPRAS\s+PATAGONIA\s+24\s+(.*)$/i))){
    let n = m[1].replace(/^MERPAGO\*/i,"").replace(/^WWW\./i,"").trim();
    return {tipo:"Compra con tarjeta", sub:/MERPAGO/i.test(m[1])?"Mercado Pago":"", id:null, nombre:n, nota:""};
  }
  if((m = d.match(/^DEBITO\s+AUTOMATICO\s+DE\s+(.*)$/i))) return {tipo:"Débito automático", sub:"", id:null, nombre:m[1].replace(/\.$/,"").trim(), nota:""};
  if(/ANSES/i.test(d)) return {tipo:"ANSES", sub:"", id:null, nombre:"ANSES", nota:d.replace(/ANSES/i,"").trim()};
  if(/INTERES/i.test(d)) return {tipo:"Intereses", sub:"", id:null, nombre:"Intereses del banco", nota:""};
  return {tipo:"Otro", sub:"", id:null, nombre:d.trim(), nota:""};
}
const cpKeyOf = a => a.id ? "id:"+a.id : "n:"+norm(a.nombre).replace(/[^a-z0-9]+/g," ").trim();

/* reglas iniciales: se pueden cambiar en la pestaña Contrapartes */
const REGLAS = [
  [/EDETSA|EDET/i, "EDET (luz)", "Servicios"],
  [/NATURGY/i, "Naturgy (gas)", "Servicios"],
  [/TELECOM/i, "Telecom (teléfono/internet)", "Servicios"],
  [/SURA/i, "Seguros Sura", "Seguros"],
  [/^ANSES$/i, "ANSES", "Ingresos ANSES"],
  [/Intereses del banco/i, "Intereses del banco", "Intereses"],
];
let CP = {}; // key -> {names:Map, tipo, id}
function rebuild(){
  CP = {};
  for(const r of S.rows){
    r.a = analiza(r.d); r.cp = cpKeyOf(r.a); r.ym = r.f.slice(0,7); r.k = keyOf(r);
    const c = CP[r.cp] ||= {names:new Map(), tipos:new Set(), id:r.a.id};
    c.names.set(r.a.nombre, (c.names.get(r.a.nombre)||0)+1); c.tipos.add(r.a.tipo);
  }
  S.rows.sort((x,y)=> x.f<y.f?1:x.f>y.f?-1 : (x.imp===y.imp ? x.ord-y.ord : (x.imp<y.imp?1:-1)));
}
function regla(key){
  const c = CP[key]; if(!c) return null;
  const all = [...c.names.keys()].join(" | ");
  for(const [re,alias,cat] of REGLAS) if(re.test(all)) return {alias,cat};
  return null;
}
function cpName(key){
  if(S.config.alias[key]) return S.config.alias[key];
  const rg = regla(key); if(rg) return rg.alias;
  const c = CP[key]; if(!c) return key;
  const best = [...c.names.entries()].sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0];
  return best && best[0] ? titleCase(best[0]) : (c.id ? "CUIT/CUIL "+c.id : "(sin nombre)");
}
function cpCat(key){
  if(S.config.cat[key]) return S.config.cat[key];
  const rg = regla(key); if(rg) return rg.cat;
  const c = CP[key];
  if(c && c.tipos.has("Compra con tarjeta")) return "Compras";
  if(c && c.tipos.has("Débito automático")) return "Servicios";
  return "Sin clasificar";
}
function allCats(){ const s=new Set(CATS_DEF); Object.values(S.config.cat).forEach(c=>s.add(c)); return [...s]; }

/* ---------- importar y quitar duplicados ---------- */
async function importar(files){
  if(!esAdmin()){ showMsg("warn","Solo el administrador puede cargar resúmenes."); return; }
  const badge=$("#stBadge");
  for(const file of files){
    try{
      badge.textContent="Leyendo "+file.name+"…";
      const res = parseFile(await file.arrayBuffer(), file.name);
      badge.textContent="Guardando en la hoja…";
      const r = await apiPost("importar", {archivo:file.name, cuenta:res.cuenta, saldosAl:res.saldosAl, rows:res.rows});
      if(r.rechazado){ showMsg("err",`<b>${esc(file.name)}</b>: es de otra cuenta (${esc(res.cuenta)}), no de la de Mary (${esc(r.cuentaGuardada)}). No lo cargué.`); continue; }
      let txt = `<b>${esc(file.name)}</b> (${fFecha(r.desde)} a ${fFecha(r.hasta)}): ${res.rows.length} líneas → <b>${r.nuevas} ${r.nuevas===1?"nueva":"nuevas"}</b>${r.dup?`, ${r.dup} ya ${r.dup===1?"estaba cargada y la descarté":"estaban cargadas y las descarté"}`:""}.`;
      let tipo="ok";
      if(r.antesMax && r.desde > r.antesMax){ txt += `<br>Atención: este resumen empieza el ${fFecha(r.desde)} y lo último que había era del ${fFecha(r.antesMax)}. Si hubo movimientos entre medio, faltan: conviene descargar un resumen que cubra esos días.`; tipo="warn"; }
      else if(r.antesMin && r.hasta < r.antesMin){ txt += `<br>Atención: este resumen termina el ${fFecha(r.hasta)} y lo cargado empezaba el ${fFecha(r.antesMin)}. Podría faltar algo entre medio.`; tipo="warn"; }
      showMsg(tipo, txt);
    }catch(e){
      console.error(e);
      showMsg("err",`<b>${esc(file.name)}</b>: no lo pude cargar: ${esc(e.message)}`);
    }
  }
  await recargar();
}

/* posibles duplicados: mismo día, mismo importe, misma contraparte, distinto saldo */
function posiblesDup(){
  const g={};
  for(const r of S.rows){ const k=[r.f,r.cp,r.deb.toFixed(2),r.cred.toFixed(2)].join("|"); (g[k] ||= []).push(r); }
  return Object.entries(g).filter(([k,v])=>v.length>1).map(([k,v])=>({k,rows:v,ok:!!S.config.okDup[k]}));
}

/* ---------- filtros de período ---------- */
function meses(){ return [...new Set(S.rows.map(r=>r.ym))].sort(); }
function enPeriodo(rows){
  const p=UI.periodo; if(p==="todo") return rows;
  if(p==="u3"){ const ms=meses().slice(-3); return rows.filter(r=>ms.includes(r.ym)); }
  return rows.filter(r=>r.ym===p);
}
function periodoTxt(){ const p=UI.periodo; return p==="todo"?"todo lo cargado":p==="u3"?"los últimos 3 meses":mesLabel(p); }

/* ---------- recurrentes ---------- */
function recurrentes(dir){
  const M = meses().length || 1;
  const g={};
  for(const r of S.rows){ const v = dir==="sal"?r.deb:r.cred; if(v>0) (g[r.cp] ||= []).push({...r, v}); }
  const out=[];
  for(const [cp,list] of Object.entries(g)){
    const ms = new Set(list.map(r=>r.ym));
    const auto = list.some(r=>r.a.tipo==="Débito automático");
    const n = list.length;
    if(!(auto || (ms.size>=2 && n>=2) || (M===1 && n>=3))) continue;
    const fechas = [...new Set(list.map(r=>r.f))].sort();
    const gaps = fechas.slice(1).map((f,i)=>diffDays(fechas[i],f));
    const med = median(gaps);
    let freq;
    if(!gaps.length) freq = auto ? "Mensual (débito automático)" : "—";
    else if(med<=9) freq="Varias veces al mes";
    else if(med<=19) freq="Quincenal";
    else if(med<=40) freq="Mensual";
    else freq="Irregular";
    const vals = list.map(r=>r.v), total = vals.reduce((a,b)=>a+b,0), prom = total/n;
    const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-prom)**2,0)/n), cv = prom? sd/prom : 0;
    const ultima = fechas[fechas.length-1];
    let proxima = null;
    if(freq.startsWith("Mensual")) proxima = addDays(ultima, gaps.length? med : 30);
    else if(freq==="Quincenal") proxima = addDays(ultima, med);
    out.push({cp, n, meses:ms.size, M, freq, total, prom, min:Math.min(...vals), max:Math.max(...vals), fijo: cv<0.08, porMes: total/M, ultima, proxima, auto});
  }
  return out.sort((a,b)=>b.porMes-a.porMes);
}

  const imps = S.imports.slice().reverse();
  return `<div class="card"><h2>Cómo se evitan los duplicados</h2>
   <p class="sub" style="margin:0">Cada vez que se carga un resumen, la app compara cada línea (fecha, descripción, importes y saldo) con lo que ya había. Si ya estaba, la descarta. Así podés cargar resúmenes que se solapan, o el mismo dos veces, sin que se dupliquen. Si en un mismo día hubo dos movimientos idénticos de verdad, se respetan los dos porque el saldo después de cada uno es distinto.</p></div>
  <div class="card"><h2>Para revisar: posibles duplicados ${pend.length?`<span class="badge">${pend.length}</span>`:""}</h2>
   <p class="sub">Mismo día, mismo importe y misma persona o comercio, pero con distinto saldo: lo más probable es que sean dos movimientos reales, pero conviene mirarlo. Si alguno sobra, eliminalo.</p>
   ${pend.length? pend.map(gr).join("") : '<p class="small">Nada pendiente. 👍</p>'}
   ${rev.length?`<details><summary class="small">Ya revisados (${rev.length})</summary>${rev.map(gr).join("")}</details>`:""}
  </div>
  <div class="card"><h2>Resúmenes cargados</h2>
   ${imps.length?`<div class="tw"><table><tr><th>Cargado</th><th>Archivo</th><th>Período</th><th class="num">Líneas</th><th class="num">Nuevas</th><th class="num">Duplicadas descartadas</th></tr>
   ${imps.map(i=>`<tr><td class="small">${new Date(i.id).toLocaleString("es-AR")}</td><td class="small">${esc(i.archivo)}</td><td>${fFecha(i.desde)} – ${fFecha(i.hasta)}</td><td class="num">${i.filas}</td><td class="num">${i.nuevas}</td><td class="num">${i.dup}</td></tr>`).join("")}</table></div>`:'<p class="small">Todavía no cargaste ninguno.</p>'}
   ${S.rows.length&&esAdmin()?`<p style="margin-top:14px"><button class="btn sm danger" id="wipe">Borrar todos los movimientos…</button></p>`:""}
  </div>`;
}
function gr(g){
  const r0=g.rows[0];
  return `<div class="dupg"><div class="h"><span><b>${fFecha(r0.f)}</b> · ${esc(cpName(r0.cp))} · ${money(r0.deb||r0.cred)} ${r0.deb?"(salida)":"(entrada)"} · ${g.rows.length} veces</span>
   ${!esAdmin()?"":g.ok?`<button class="btn sm" data-unok="${esc(g.k)}">Volver a revisar</button>`:`<button class="btn sm" data-ok="${esc(g.k)}">Están bien, son ${g.rows.length} movimientos reales</button>`}</div>
   <table>${g.rows.map(r=>`<tr><td class="small">${esc(r.d)}</td><td class="num small">saldo ${money(r.saldo)}</td><td class="num">${esAdmin()?`<button class="btn sm danger" data-del="${esc(r.id)}">Eliminar esta línea</button>`:""}</td></tr>`).join("")}</table></div>`;
}

/* --- Contrapartes --- */
function vCps(){
  const L = Object.keys(CP).map(k=>{ const R=S.rows.filter(r=>r.cp===k); return {k, ent:R.reduce((a,r)=>a+r.cred,0), sal:R.reduce((a,r)=>a+r.deb,0), n:R.length}; })
    .sort((a,b)=>(cpCat(a.k)==="Sin clasificar"?0:1)-(cpCat(b.k)==="Sin clasificar"?0:1) || (b.ent+b.sal)-(a.ent+a.sal));
  const cats = allCats();
  const sc = L.filter(x=>cpCat(x.k)==="Sin clasificar").length;
  return `<div class="card"><h2>Personas, comercios y organismos</h2>
   <p class="sub">${esAdmin()?"":"Solo el administrador puede cambiar nombres y categorías. "}Poné un nombre fácil y una categoría a cada uno; se aplica a todos sus movimientos, también a los que cargues más adelante. ${sc?`<b>${sc} sin clasificar</b> (arriba de todo).`:""}</p>
   <div class="tw"><table><tr><th>Nombre en la app</th><th>Como aparece en el banco</th><th>Categoría</th><th class="num">Salidas</th><th class="num">Entradas</th></tr>
   ${L.map(x=>{ const c=CP[x.k]; return `<tr><td>${esAdmin()?`<input type="text" data-alias="${esc(x.k)}" value="${esc(cpName(x.k))}" style="width:100%;min-width:150px">`:`<b>${esc(cpName(x.k))}</b>`}</td>
     <td class="small">${esc([...c.names.keys()].join(" · "))}${c.id?"<br>CUIT/CUIL "+esc(c.id):""}</td>
     <td>${esAdmin()?`<select data-cat="${esc(x.k)}">${cats.map(ct=>`<option ${ct===cpCat(x.k)?"selected":""}>${esc(ct)}</option>`).join("")}<option value="__new">+ Nueva categoría…</option></select>`:`<span class="tag">${esc(cpCat(x.k))}</span>`}</td>
     <td class="num">${x.sal?money0(x.sal):""}</td><td class="num cr">${x.ent?money0(x.ent):""}</td></tr>`; }).join("")}
   </table></div></div>`;
}

/* --- eventos por vista --- */
function irACp(cp){ UI.cpF=cp; UI.tab="movs"; UI.tipoF="todos"; UI.q=""; render(); window.scrollTo(0,0); }
const after = {
  resumen(){ chartMes(); document.querySelectorAll("tr[data-cp]").forEach(t=>t.onclick=()=>irACp(t.dataset.cp)); },
  movs(){
    const q=$("#q"); let tm; q.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ UI.q=q.value; const pos=q.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); },250); };
    $("#tipoF").onchange=e=>{UI.tipoF=e.target.value; render();};
    if($("#cpX")) $("#cpX").onclick=()=>{UI.cpF=""; render();};
    document.querySelectorAll(".click-cp").forEach(s=>s.onclick=()=>irACp(s.dataset.cp));
  },
  recur(){ document.querySelectorAll("tr[data-cp]").forEach(t=>t.onclick=()=>{ UI.periodo="todo"; irACp(t.dataset.cp); }); },
  transf(){
    document.querySelectorAll("[data-tr]").forEach(c=>c.onclick=()=>{UI.trF=c.dataset.tr; render();});
    document.querySelectorAll("tr[data-cp]").forEach(t=>t.onclick=()=>irACp(t.dataset.cp));
  },
  dups(){
    document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{ S.config.okDup[b.dataset.ok]=true; persist(()=>apiPost("okDup",{gk:b.dataset.ok,valor:true})); render(); });
    document.querySelectorAll("[data-unok]").forEach(b=>b.onclick=()=>{ delete S.config.okDup[b.dataset.unok]; persist(()=>apiPost("okDup",{gk:b.dataset.unok,valor:false})); render(); });
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirmar("¿Eliminar esta línea?","Se quita de la app (no del banco). Si te equivocás, volvé a cargar el resumen y reaparece.","Eliminar",()=>borrarFila(b.dataset.del)));
    if($("#wipe")) $("#wipe").onclick=()=>confirmar("¿Borrar todos los movimientos?","Se borran todos los movimientos cargados. Los nombres y categorías se conservan. Después podés volver a cargar los resúmenes.","Borrar todo",borrarTodo);
  },
  cps(){
    document.querySelectorAll("[data-alias]").forEach(i=>i.onchange=()=>{ const k=i.dataset.alias, v=i.value.trim(); if(v) S.config.alias[k]=v; else delete S.config.alias[k]; guardarCp(k); render(); });
    document.querySelectorAll("[data-cat]").forEach(s=>s.onchange=()=>{
      const k=s.dataset.cat;
      if(s.value==="__new"){ pedirTexto("Nueva categoría","Nombre de la categoría (ej. Médicos, Farmacia, Alquiler peluquería):", v=>{ S.config.cat[k]=v; guardarCp(k); render(); }, ()=>render()); return; }
      S.config.cat[k]=s.value; guardarCp(k); render();
    });
  }
};

function guardarCp(k){ persist(()=>apiPost("contraparte",{clave:k, nombre:S.config.alias[k]||cpName(k), cat:S.config.cat[k]||cpCat(k)})); }

/* --- diálogos propios (los del navegador están bloqueados aquí) --- */
function confirmar(titulo, texto, boton, ok){
  const r=$("#modalRoot"); r.innerHTML=`<div class="modal-bg"><div class="modal"><h3>${esc(titulo)}</h3><p class="small">${esc(texto)}</p><div class="acts"><button class="btn" id="mNo">Cancelar</button><button class="btn pri" id="mSi">${esc(boton)}</button></div></div></div>`;
  $("#mNo").onclick=()=>r.innerHTML=""; $("#mSi").onclick=()=>{ r.innerHTML=""; ok(); };
}
function pedirTexto(titulo, texto, ok, cancel){
  const r=$("#modalRoot"); r.innerHTML=`<div class="modal-bg"><div class="modal"><h3>${esc(titulo)}</h3><p class="small">${esc(texto)}</p><input type="text" id="mTx" style="width:100%"><div class="acts"><button class="btn" id="mNo">Cancelar</button><button class="btn pri" id="mSi">Guardar</button></div></div></div>`;
  const i=$("#mTx"); i.focus();
  const go=()=>{ const v=i.value.trim(); r.innerHTML=""; v?ok(v):cancel(); };
  $("#mNo").onclick=()=>{ r.innerHTML=""; cancel(); }; $("#mSi").onclick=go; i.onkeydown=e=>{ if(e.key==="Enter") go(); };
}


/* --- arranque --- */
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-t]"); if(b){ UI.tab=b.dataset.t; render(); } });
$("#file").addEventListener("change",e=>{ const f=[...e.target.files]; e.target.value=""; if(f.length) importar(f); });
let dragN=0;
window.addEventListener("dragenter",e=>{ if(esAdmin() && [...(e.dataTransfer?.types||[])].includes("Files")){ dragN++; $("#overlay").classList.add("on"); } });
window.addEventListener("dragleave",()=>{ dragN=Math.max(0,dragN-1); if(!dragN) $("#overlay").classList.remove("on"); });
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>{ e.preventDefault(); dragN=0; $("#overlay").classList.remove("on"); const f=[...(e.dataTransfer?.files||[])]; if(f.length) importar(f); });
let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(UI.tab==="resumen") chartMes(); },200); });

function pantallaClave(error){
  $("#tabs").innerHTML=""; $("#filtros").innerHTML=""; $("#btnFile").hidden=true; $("#stBadge").textContent="Sin entrar";
  $("#view").innerHTML = `<div class="card empty" style="max-width:420px;margin:30px auto">
    <h2>Entrar</h2><p class="small">Escribí la clave que te pasó Oscar.</p>
    <form id="fClave"><input type="password" id="clave" autocomplete="current-password" style="width:100%;margin:6px 0 10px" placeholder="Clave">
    <button class="btn pri" style="width:100%">Entrar</button></form>
    ${error?`<p class="small" style="color:var(--err-tx)">${esc(error)}</p>`:""}</div>`;
  $("#fClave").onsubmit = e => { e.preventDefault(); const k=$("#clave").value.trim(); if(!k) return; setClave(k); recargar(); };
  $("#clave").focus();
}
$("#btnRef").onclick = () => { if(getClave()) recargar(); };
$("#btnSalir").onclick = () => { setClave(""); ROL=null; S.rows=[]; rebuild(); $("#msgs").innerHTML=""; pantallaClave(); };
(function start(){
  if(typeof XLSX==="undefined") showMsg("err","No se pudo cargar el lector de Excel. Revisá la conexión y recargá la página.");
  if(API_URL.startsWith("PEGAR")){ $("#view").innerHTML='<div class="card empty"><h2>Falta conectar la hoja</h2><p class="small">Falta pegar en <code>index.html</code> la dirección del Apps Script (API_URL).</p></div>'; $("#stBadge").textContent="Sin configurar"; return; }
  if(getClave()) recargar(); else pantallaClave();
})();
</script>
</body>
</html>
